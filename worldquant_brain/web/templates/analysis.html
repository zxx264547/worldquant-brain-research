<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据分析 — BRAIN Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace; background: #0d1117; color: #c9d1d9; padding: 20px; }
        .header { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #21262d; }
        .header h1 { font-size: 22px; color: #58a6ff; }
        .nav { display: flex; gap: 12px; margin-bottom: 20px; }
        .nav a { color: #58a6ff; text-decoration: none; font-size: 14px; padding: 6px 14px; border-radius: 6px; border: 1px solid #21262d; transition: all 0.2s; }
        .nav a:hover, .nav a.active { background: #1f6feb22; border-color: #58a6ff; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(460px, 1fr)); gap: 16px; }
        .card { background: #161b22; border: 1px solid #21262d; border-radius: 8px; padding: 20px; }
        .card h3 { font-size: 15px; color: #f0f6fc; margin-bottom: 14px; }
        .card.full { grid-column: 1 / -1; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; padding: 6px 10px; color: #8b949e; font-weight: 600; border-bottom: 1px solid #21262d; font-size: 11px; text-transform: uppercase; }
        td { padding: 5px 10px; border-bottom: 1px solid #21262d24; }
        tr:hover { background: #1c2129; }
        .bar-chart { display: flex; align-items: flex-end; gap: 8px; height: 180px; padding: 8px 0; position: relative; }
        .bar-group { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .bar { width: 100%; max-width: 60px; border-radius: 4px 4px 0 0; transition: all 0.3s; cursor: pointer; position: relative; }
        .bar:hover { filter: brightness(1.3); }
        .bar-label { font-size: 10px; color: #8b949e; text-align: center; }
        .bar-value { font-size: 11px; color: #c9d1d9; font-weight: bold; }
        .bar-pos { background: linear-gradient(180deg, #3fb950, #1b5a1b); }
        .bar-mid { background: linear-gradient(180deg, #d29922, #5a3a1b); }
        .bar-neg { background: linear-gradient(180deg, #f85149, #5a1b1b); }
        .bar-high { background: linear-gradient(180deg, #58a6ff, #1b3a5a); }
        .stat-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #21262d24; font-size: 13px; }
        .stat-row .val { font-weight: bold; color: #58a6ff; }
        .stat-row .val.green { color: #3fb950; }
        .stat-row .val.red { color: #f85149; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
        .badge-ok { background: #1b3a1b; color: #3fb950; }
        .badge-warn { background: #3a2e1b; color: #d29922; }
        .progress-bar { height: 6px; background: #21262d; border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
        .compare-row { display: flex; gap: 6px; align-items: center; margin: 3px 0; }
        .compare-row .name { width: 100px; font-size: 12px; text-align: right; color: #8b949e; }
        .compare-row .bar-wrap { flex: 1; height: 22px; background: #21262d; border-radius: 3px; overflow: hidden; }
        .compare-row .bar-inner { height: 100%; border-radius: 3px; display: flex; align-items: center; padding-left: 8px; font-size: 11px; font-weight: bold; color: #fff; }
        .tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; margin-left: 4px; }
        .tag-ok { background: #1b3a1b; color: #3fb950; }
        .tag-warn { background: #3a2e1b; color: #d29922; }
        .trend-dots { display: flex; gap: 3px; flex-wrap: wrap; padding: 8px 0; }
        .trend-dot { width: 14px; height: 14px; border-radius: 3px; }
        .trend-dot.pass { background: #3fb950; }
        .trend-dot.partial { background: #d29922; }
        .trend-dot.fail { background: #f85149; }
        .footer { text-align: center; font-size: 11px; color: #484f58; margin-top: 20px; padding-top: 15px; border-top: 1px solid #21262d; }
        .insight { background: #1f6feb11; border-left: 3px solid #58a6ff; padding: 8px 12px; border-radius: 4px; font-size: 13px; margin-bottom: 10px; color: #8b949e; }
    </style>
</head>
<body>
    <div class="header"><h1>📊 数据分析</h1></div>
    <div class="nav">
        <a href="/">📊 仪表盘</a>
        <a href="/alphas">📋 Alpha列表</a>
        <a href="/analysis" class="active">📊 数据分析</a>
    </div>

    <div class="grid">
        <!-- Sharpe分布 -->
        <div class="card">
            <h3>📈 Sharpe 分布</h3>
            <div class="bar-chart" id="distChart"></div>
            <div id="distStats" style="margin-top:12px"></div>
        </div>

        <!-- PPA合规 -->
        <div class="card">
            <h3>✅ PPA 合规分析</h3>
            <div id="ppaContent"></div>
        </div>

        <!-- 组合类型对比 -->
        <div class="card">
            <h3>🔀 组合类型对比</h3>
            <div id="comboContent"></div>
        </div>

        <!-- 技术信号排名 -->
        <div class="card">
            <h3>📡 技术信号效果排名</h3>
            <div id="techContent"></div>
        </div>

        <!-- 权重分析 -->
        <div class="card">
            <h3>⚖️ 权重参数分析</h3>
            <div id="weightContent"></div>
        </div>

        <!-- 综合统计 -->
        <div class="card">
            <h3>📋 综合统计</h3>
            <div id="summaryContent"></div>
        </div>

        <!-- PPA趋势 -->
        <div class="card full">
            <h3>🔄 PPA 达标趋势 (最近50条, 每点=1条Alpha)</h3>
            <div class="trend-dots" id="ppaTrend"></div>
            <div style="font-size:11px;color:#8b949e;margin-top:6px">
                <span style="color:#3fb950">■</span> 4/4全过
                <span style="color:#d29922;margin-left:10px">■</span> 2-3/4
                <span style="color:#f85149;margin-left:10px">■</span> 0-1/4
            </div>
        </div>

        <!-- 关键洞察 -->
        <div class="card full">
            <h3>💡 关键洞察</h3>
            <div id="insights"></div>
        </div>
    </div>

    <div class="footer">WorldQuant BRAIN · Data Analysis · <span id="updateTime"></span></div>

    <script>
        const COLORS = ['#58a6ff','#3fb950','#d29922','#f85149','#bc8cff','#79c0ff','#56d364'];

        async function load() {
            const [dist, ppa, combo, tech, weight, summary] = await Promise.all([
                fetch('/api/analysis/distribution').then(r => r.json()),
                fetch('/api/analysis/ppa').then(r => r.json()),
                fetch('/api/analysis/by_combo').then(r => r.json()),
                fetch('/api/analysis/by_tech').then(r => r.json()),
                fetch('/api/analysis/by_weight').then(r => r.json()),
                fetch('/api/analysis/summary').then(r => r.json())
            ]);

            // ─── Sharpe分布图 ───
            let distHtml = '';
            const maxH = 160;
            for (const b of dist.buckets) {
                const h = dist.max_count > 0 ? (b.count / dist.max_count * maxH) : 0;
                let cls = 'bar-pos';
                if (b.range === '< 0') cls = 'bar-neg';
                else if (b.range.startsWith('0.0') || b.range.startsWith('0.5')) cls = 'bar-mid';
                else if (b.range === '>= 1.58') cls = 'bar-high';
                distHtml += `<div class="bar-group">
                    <div class="bar-value">${b.count}</div>
                    <div class="bar ${cls}" style="height:${h}px" title="${b.range}: ${b.count}"></div>
                    <div class="bar-label">${b.range}</div>
                </div>`;
            }
            document.getElementById('distChart').innerHTML = distHtml;

            const s = dist.stats;
            document.getElementById('distStats').innerHTML = `
                <div class="stat-row"><span>总数</span><span class="val">${s.count}</span></div>
                <div class="stat-row"><span>均值</span><span class="val">${s.mean}</span></div>
                <div class="stat-row"><span>中位数</span><span class="val">${s.median}</span></div>
                <div class="stat-row"><span>标准差</span><span class="val">${s.std}</span></div>
                <div class="stat-row"><span>正值率</span><span class="val green">${s.pct_positive}%</span></div>
                <div class="stat-row"><span>Sharpe≥1.0</span><span class="val ${s.pct_above_1>20?'green':'red'}">${s.pct_above_1}%</span></div>
                <div class="stat-row"><span>可提交率</span><span class="val ${s.pct_submittable>0?'green':'red'}">${s.pct_submittable}%</span></div>`;

            // ─── PPA合规 ───
            let ppaHtml = '';
            for (const c of ppa.criteria) {
                const pct = c.pct;
                const color = pct > 50 ? '#3fb950' : (pct > 20 ? '#d29922' : '#f85149');
                ppaHtml += `<div style="margin-bottom:10px">
                    <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px">
                        <span>${c.name}</span><span style="color:${color}">${c.pass}/${ppa.total} (${pct}%)</span>
                    </div>
                    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${color}"></div></div>
                </div>`;
            }
            document.getElementById('ppaContent').innerHTML = ppaHtml;

            // ─── 组合类型对比 ───
            let comboHtml = '';
            if (combo.combos && combo.combos.length) {
                const maxS = Math.max(...combo.combos.map(c => Math.abs(c.max_sharpe || 0)), 0.1);
                for (const c of combo.combos.slice(0, 6)) {
                    const w = Math.max(5, Math.abs(c.max_sharpe || 0) / maxS * 100);
                    const color = (c.max_sharpe || 0) >= 1.0 ? '#3fb950' : '#58a6ff';
                    comboHtml += `<div class="compare-row">
                        <span class="name">${c.combo_type}</span>
                        <div class="bar-wrap"><div class="bar-inner" style="width:${w}%;background:${color}">${(c.max_sharpe||0).toFixed(2)}</div></div>
                        <span style="font-size:11px;color:#8b949e;width:60px">n=${c.cnt}</span></div>`;
                }
            } else { comboHtml = '<div style="color:#484f58;text-align:center;padding:20px">暂无组合数据</div>'; }
            document.getElementById('comboContent').innerHTML = comboHtml;

            // ─── 技术信号排名 ───
            let techHtml = '';
            if (tech.techs && tech.techs.length) {
                const maxT = Math.max(...tech.techs.map(t => Math.abs(t.max_sharpe || 0)), 0.1);
                for (const t of tech.techs.slice(0, 10)) {
                    const w = Math.max(5, Math.abs(t.max_sharpe || 0) / maxT * 100);
                    const cls = (t.max_sharpe || 0) >= 1.0 ? '#3fb950' : '#58a6ff';
                    techHtml += `<div class="compare-row">
                        <span class="name">${t.tech_signal}</span>
                        <div class="bar-wrap"><div class="bar-inner" style="width:${w}%;background:${cls}">${(t.max_sharpe||0).toFixed(2)}</div></div>
                        <span style="font-size:11px;color:#8b949e;width:60px">n=${t.cnt}</span></div>`;
                }
            } else { techHtml = '<div style="color:#484f58;text-align:center;padding:20px">暂无信号数据</div>'; }
            document.getElementById('techContent').innerHTML = techHtml;

            // ─── 权重分析 ───
            let wHtml = '';
            if (weight.weights && weight.weights.length) {
                const maxW = Math.max(...weight.weights.map(w => Math.abs(w.max_sharpe || 0)), 0.1);
                for (const w of weight.weights) {
                    const pct = Math.max(5, Math.abs(w.max_sharpe || 0) / maxW * 100);
                    wHtml += `<div class="compare-row">
                        <span class="name">weight=${w.weight}</span>
                        <div class="bar-wrap"><div class="bar-inner" style="width:${pct}%;background:#bc8cff">${(w.max_sharpe||0).toFixed(2)}</div></div>
                        <span style="font-size:11px;color:#8b949e;width:80px">avg=${(w.avg_sharpe||0).toFixed(2)}</span></div>`;
                }
            } else { wHtml = '<div style="color:#484f58;text-align:center;padding:20px">暂无权重数据</div>'; }
            document.getElementById('weightContent').innerHTML = wHtml;

            // ─── 综合统计 ───
            document.getElementById('summaryContent').innerHTML = `
                <div class="stat-row"><span>总Alpha数</span><span class="val">${summary.total}</span></div>
                <div class="stat-row"><span>最佳Sharpe</span><span class="val green">${(summary.best_sharpe||0).toFixed(3)}</span></div>
                <div class="stat-row"><span>平均Sharpe</span><span class="val">${(summary.avg_sharpe||0).toFixed(3)}</span></div>
                <div class="stat-row"><span>最近20平均</span><span class="val ${summary.trend==='improving'?'green':''}">${(summary.recent_avg_sharpe||0).toFixed(3)} ${summary.trend==='improving'?'↑':'→'}</span></div>
                <div class="stat-row"><span>平均Fitness</span><span class="val">${(summary.avg_fitness||0).toFixed(2)}</span></div>
                <div class="stat-row"><span>平均PPC</span><span class="val ${(summary.avg_ppc||0)<0.5?'green':'red'}">${(summary.avg_ppc||0).toFixed(3)}</span></div>
                <div class="stat-row"><span>平均Margin</span><span class="val">${(summary.avg_margin||0).toFixed(4)}</span></div>
                <div class="stat-row"><span>平均换手率</span><span class="val">${(summary.avg_turnover||0).toFixed(4)}</span></div>`;

            // ─── PPA趋势 ───
            let dots = '';
            for (const p of ppa.ppa_trend || []) {
                let cls = p.all_pass ? 'pass' : (p.score >= 2 ? 'partial' : 'fail');
                dots += `<div class="trend-dot ${cls}" title="Sharpe=${p.sharpe.toFixed(2)} Score=${p.score}/4 ${p.time}"></div>`;
            }
            document.getElementById('ppaTrend').innerHTML = dots || '<span style="color:#484f58">暂无数据</span>';

            // ─── 关键洞察 ───
            let insights = [];
            if (s.pct_submittable === 0) insights.push('⚠️ 当前尚无Sharpe≥1.58的可提交Alpha，最佳为' + s.max.toFixed(2));
            if (s.pct_above_1 >= 30) insights.push('✅ ' + s.pct_above_1 + '%的Alpha Sharpe≥1.0，基础信号质量良好');
            if (combo.best_combo) insights.push('🔀 最佳组合类型: <b>' + combo.best_combo + '</b>，建议优先使用该组合方式');
            if (summary.trend === 'improving') insights.push('📈 近期Sharpe呈上升趋势，当前策略方向正确');
            const bestTech = tech.techs && tech.techs[0];
            if (bestTech && bestTech.max_sharpe >= 1.0) insights.push('📡 最强技术信号: <b>' + bestTech.tech_signal + '</b> (Sharpe=' + bestTech.max_sharpe.toFixed(2) + ')，建议多使用该信号');
            if ((summary.avg_ppc || 0) < 0.5) insights.push('✅ 平均PPC ' + summary.avg_ppc.toFixed(3) + ' < 0.5，PPA标准达标率良好');
            if (!insights.length) insights.push('📋 数据积累中，继续挖掘将产生更多洞察');
            document.getElementById('insights').innerHTML = insights.map(i => '<div class="insight">' + i + '</div>').join('');

            document.getElementById('updateTime').textContent = new Date().toLocaleTimeString('zh-CN');
        }

        load();
    </script>
</body>
</html>
