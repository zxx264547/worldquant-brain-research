<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha 列表 — BRAIN Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace; background: #0d1117; color: #c9d1d9; padding: 20px; }
        .header { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #21262d; }
        .header h1 { font-size: 22px; color: #58a6ff; }
        .nav { display: flex; gap: 12px; margin-bottom: 16px; }
        .nav a { color: #58a6ff; text-decoration: none; font-size: 14px; padding: 6px 14px; border-radius: 6px; border: 1px solid #21262d; transition: all 0.2s; }
        .nav a:hover, .nav a.active { background: #1f6feb22; border-color: #58a6ff; }
        .controls { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
        .controls select, .controls input { background: #161b22; border: 1px solid #21262d; color: #c9d1d9; padding: 6px 12px; border-radius: 6px; font-size: 13px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; background: #161b22; border: 1px solid #21262d; border-radius: 8px; overflow: hidden; }
        th { text-align: left; padding: 10px 14px; color: #8b949e; font-weight: 600; border-bottom: 1px solid #21262d; font-size: 11px; text-transform: uppercase; background: #161b22; cursor: pointer; }
        th:hover { color: #58a6ff; }
        td { padding: 7px 14px; border-bottom: 1px solid #21262d24; }
        tr.row-clickable { cursor: pointer; transition: background 0.15s; }
        tr.row-clickable:hover { background: #1c2129; }
        tr.row-clickable.selected { background: #1f6feb15; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
        .badge-aplus { background: #1b3a3a; color: #58a6ff; }
        .badge-a { background: #1b3a1b; color: #3fb950; }
        .badge-b { background: #3a2e1b; color: #d29922; }
        .badge-c { background: #3a1b1b; color: #f85149; }
        .badge-d { background: #2a1b1b; color: #ff6b6b; }
        .detail-panel { display: none; }
        .detail-panel td { padding: 0; }
        .detail-inner { background: #0d1117; padding: 20px; border-left: 3px solid #58a6ff; margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 800px) { .detail-inner { grid-template-columns: 1fr; } }
        .detail-section h4 { font-size: 13px; color: #58a6ff; margin-bottom: 8px; }
        .detail-section .item { font-size: 12px; padding: 4px 0; color: #8b949e; }
        .detail-section .item b { color: #c9d1d9; }
        .ppa-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .ppa-item { padding: 6px 10px; border-radius: 4px; font-size: 12px; }
        .ppa-pass { background: #1b3a1b; color: #3fb950; }
        .ppa-fail { background: #3a1b1b; color: #f85149; }
        .issue-tag { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; margin: 2px; background: #3a2e1b; color: #d29922; }
        .suggest-tag { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; margin: 2px; background: #1b3a3a; color: #58a6ff; }
        .expr-code { font-family: 'Fira Code', 'Consolas', monospace; font-size: 12px; color: #79c0ff; background: #161b22; padding: 8px; border-radius: 6px; word-break: break-all; display: block; }
        .loading { color: #484f58; text-align: center; padding: 20px; }
        .pagination { display: flex; gap: 8px; margin-top: 16px; justify-content: center; }
        .pagination button { background: #161b22; border: 1px solid #21262d; color: #58a6ff; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .pagination button:hover { background: #1f6feb22; }
        .pagination button:disabled { color: #484f58; cursor: default; }
        .footer { text-align: center; font-size: 11px; color: #484f58; margin-top: 20px; padding-top: 15px; border-top: 1px solid #21262d; }
    </style>
</head>
<body>
    <div class="header"><h1>📋 Alpha 列表 — 点击展开详情</h1></div>
    <div class="nav">
        <a href="/">📊 仪表盘</a>
        <a href="/alphas" class="active">📋 Alpha列表</a>
        <a href="/analysis">📊 数据分析</a>
    </div>
    <div class="controls">
        <span style="font-size:13px;color:#8b949e">排序:</span>
        <select id="sortBy" onchange="loadPage(0)"><option value="sharpe">Sharpe ↓</option><option value="fitness">Fitness ↓</option><option value="created_at">时间 ↓</option><option value="margin">Margin ↓</option></select>
        <span style="font-size:13px;color:#8b949e;margin-left:12px">每页:</span>
        <select id="pageSize" onchange="loadPage(0)"><option value="20" selected>20</option><option value="50">50</option></select>
        <span style="font-size:12px;color:#8b949e;margin-left:12px">💡 点击任意行查看表达式解释+回测分析</span>
    </div>
    <table>
        <thead><tr><th>#</th><th>名称</th><th>Sharpe</th><th>Fitness</th><th>PPC</th><th>评级</th><th>时间</th></tr></thead>
        <tbody id="alphaTable"></tbody>
    </table>
    <div class="pagination" id="pager"></div>
    <div class="footer">WorldQuant BRAIN · Alpha List · Click to inspect</div>

    <script>
        let currentPage = 0, totalPages = 0, openRow = null;

        async function loadPage(page) {
            const sort = document.getElementById('sortBy').value;
            const size = document.getElementById('pageSize').value;
            const data = await fetch(`/api/alphas?limit=${size}&offset=${page*size}&sort=${sort}`).then(r => r.json());
            totalPages = Math.ceil(data.total / size);
            let html = '';

            for (const [i, a] of data.alphas.entries()) {
                let gradeBadge;
                if (a.sharpe >= 1.58) gradeBadge = '<span class="badge badge-aplus">A+ 可提交</span>';
                else if (a.sharpe >= 1.0) gradeBadge = '<span class="badge badge-a">A 有潜力</span>';
                else if (a.sharpe >= 0.5) gradeBadge = '<span class="badge badge-b">B 待优化</span>';
                else if (a.sharpe >= 0) gradeBadge = '<span class="badge badge-c">C 弱</span>';
                else gradeBadge = '<span class="badge badge-d">D 无效</span>';

                html += `<tr class="row-clickable" onclick="toggleDetail('${a.id}', this)" id="row-${a.id}">
                    <td>${page*parseInt(size)+i+1}</td>
                    <td title="${a.expression||''}">${(a.name||'').substring(0,35)}</td>
                    <td><b>${(a.sharpe||0).toFixed(3)}</b></td>
                    <td>${(a.fitness||0).toFixed(2)}</td>
                    <td>${(a.ppc||0).toFixed(3)}</td>
                    <td>${gradeBadge}</td>
                    <td style="font-size:11px;color:#8b949e">${(a.created_at||'').substring(0,16)}</td>
                </tr>`;
                html += `<tr class="detail-panel" id="detail-${a.id}"><td colspan="7"><div class="detail-inner"><div class="loading">点击加载详情...</div></div></td></tr>`;
            }
            if (!data.alphas.length) html = '<tr><td colspan="7" style="text-align:center;color:#484f58;padding:40px">暂无数据</td></tr>';
            document.getElementById('alphaTable').innerHTML = html;

            let pager = '';
            pager += `<button onclick="loadPage(0)" ${page===0?'disabled':''}>«</button>`;
            pager += `<button onclick="loadPage(${page-1})" ${page===0?'disabled':''}>‹</button>`;
            pager += `<span style="color:#8b949e;font-size:13px;padding:6px 12px">${page+1} / ${totalPages||1}</span>`;
            pager += `<button onclick="loadPage(${page+1})" ${page>=totalPages-1?'disabled':''}>›</button>`;
            pager += `<button onclick="loadPage(${totalPages-1})" ${page>=totalPages-1?'disabled':''}>»</button>`;
            document.getElementById('pager').innerHTML = pager;
            currentPage = page;
        }

        async function toggleDetail(alphaId, row) {
            const detailRow = document.getElementById('detail-' + alphaId);
            const inner = detailRow.querySelector('.detail-inner');

            if (openRow === alphaId) {
                detailRow.style.display = 'none';
                row.classList.remove('selected');
                openRow = null;
                return;
            }

            if (openRow) {
                document.getElementById('detail-' + openRow).style.display = 'none';
                document.getElementById('row-' + openRow).classList.remove('selected');
            }

            detailRow.style.display = '';
            row.classList.add('selected');
            openRow = alphaId;

            if (inner.textContent.includes('点击加载')) {
                inner.innerHTML = '<div class="loading">加载中...</div>';
                try {
                    const data = await fetch('/api/alphas/' + alphaId).then(r => r.json());
                    if (data.error) {
                        inner.innerHTML = '<div class="loading">详情加载失败</div>';
                        return;
                    }
                    const e = data.explanation || {};
                    const a = data.analysis || {};
                    inner.innerHTML = `
                        <div class="detail-section">
                            <h4>📐 表达式</h4>
                            <code class="expr-code">${data.expression||''}</code>
                        </div>
                        <div class="detail-section">
                            <h4>🔍 含义解释</h4>
                            <div class="item">${e.summary_zh||''}</div>
                            ${(e.fields_used||[]).length ? `<div class="item"><b>数据字段:</b> ${e.fields_used.map(f=>f.zh_name).join(', ')}</div>` : ''}
                            ${(e.operators_used||[]).length ? `<div class="item"><b>算子:</b> ${e.operators_used.map(o=>`${o.zh_name}(${o.description})`).join(' · ')}</div>` : ''}
                            ${(e.windows||[]).length ? `<div class="item"><b>窗口:</b> ${e.windows.join(', ')}日</div>` : ''}
                            ${e.power ? `<div class="item"><b>幂指数:</b> ${e.power}</div>` : ''}
                            <div class="item"><b>结构:</b> ${e.structure_type||''}</div>
                        </div>
                        <div class="detail-section">
                            <h4>✅ PPA 合规检查</h4>
                            <div class="ppa-grid">
                                <div class="ppa-item ${a.ppa.sharpe.pass?'ppa-pass':'ppa-fail'}">Sharpe: ${a.ppa.sharpe.value.toFixed(3)} ≥ ${a.ppa.sharpe.threshold} ${a.ppa.sharpe.pass?'✓':'✗'}</div>
                                <div class="ppa-item ${a.ppa.fitness.pass?'ppa-pass':'ppa-fail'}">Fitness: ${a.ppa.fitness.value.toFixed(2)} > ${a.ppa.fitness.threshold} ${a.ppa.fitness.pass?'✓':'✗'}</div>
                                <div class="ppa-item ${a.ppa.ppc.pass?'ppa-pass':'ppa-fail'}">PPC: ${a.ppa.ppc.value.toFixed(3)} < ${a.ppa.ppc.threshold} ${a.ppa.ppc.pass?'✓':'✗'}</div>
                                <div class="ppa-item ${a.ppa.margin.pass?'ppa-pass':'ppa-fail'}">Margin: ${a.ppa.margin.value.toFixed(4)} > TO=${a.ppa.margin.threshold.toFixed(4)} ${a.ppa.margin.pass?'✓':'✗'}</div>
                            </div>
                            <div class="item" style="margin-top:6px">通过 ${a.ppa_pass_count}/4 项 · 评级: <b>${a.grade} ${a.grade_zh}</b></div>
                        </div>
                        <div class="detail-section">
                            <h4>🏷️ 诊断与建议</h4>
                            ${(a.issues||[]).map(i=>`<span class="issue-tag">⚠ ${i}</span>`).join('')}
                            ${(!a.issues||!a.issues.length)?'<div class="item" style="color:#3fb950">✅ 无严重问题</div>':''}
                            <div style="margin-top:8px">${(a.suggestions||[]).map(s=>`<span class="suggest-tag">💡 ${s}</span>`).join('')}</div>
                        </div>`;
                } catch (e) {
                    inner.innerHTML = '<div class="loading">加载失败: ' + e.message + '</div>';
                }
            }
        }

        loadPage(0);
    </script>
</body>
</html>
